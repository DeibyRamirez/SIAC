services:
  postgres:
    image: postgres:16
    container_name: siac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siac
    ports:
      - "5433:5432"
    volumes:
      - siac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siac_postgres_data:
