name: CI

on:
  push:
    branches: [develop, develop_v2, main]
  pull_request:
    branches: [develop, develop_v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      # BD efímera solo para CI: valida las migraciones y la semilla desde cero.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: siac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/siac
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
      JWT_SECRETO: ci-only-not-for-production
      S3_USAR_ALMACEN_LOCAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: Backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Aplicar migraciones en PostgreSQL de CI
        run: pnpm exec prisma migrate deploy
      - name: Verificar el estado de las migraciones
        run: pnpm exec prisma migrate status
      - name: Ejecutar la semilla
        run: pnpm prisma:seed
      - name: Pruebas del backend
        run: pnpm exec jest --runInBand
      - name: Build del backend
        run: pnpm build

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
