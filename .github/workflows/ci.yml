name: CI

on:
  push:
    branches: [develop, develop_v2, main]
  pull_request:
    branches: [develop, develop_v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      # BD efímera solo para CI: valida las migraciones desde cero. Las cuentas de prueba las crea el E2E.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: siac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/siac
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
      JWT_SECRETO: ci-only-not-for-production
      S3_USAR_ALMACEN_LOCAL: "true"
      CARRERAS_SYNC_HABILITADO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Verificar tipos del backend (tsc)
        run: pnpm exec tsc --noEmit
      - name: Aplicar migraciones en PostgreSQL de CI
        run: pnpm exec prisma migrate deploy
      - name: Verificar el estado de las migraciones
        run: pnpm exec prisma migrate status
      - name: Verificar que schema.prisma no tenga drift frente a las migraciones
        # R-008.1a: si falla, el próximo `migrate dev` generaría DROP (p. ej. del FTS searchVector).
        run: |
          psql -h localhost -U postgres -d siac -c 'CREATE DATABASE siac_shadow'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres@localhost:5432/siac_shadow \
            --exit-code
      - name: Pruebas del backend
        run: pnpm exec jest --runInBand
      - name: Habilitar el login de los roles de RLS (solo CI, contraseñas desechables)
        run: |
          psql -h localhost -U postgres -d siac -c "ALTER ROLE siac_app LOGIN PASSWORD 'ci-siac-app'"
          psql -h localhost -U postgres -d siac -c "ALTER ROLE siac_powerbi_lectura LOGIN PASSWORD 'ci-siac-powerbi'"
      - name: Pruebas E2E contra PostgreSQL de CI (supertest), con la API como siac_app (RLS aplicada)
        env:
          # La API corre sin BYPASSRLS; los datos de prueba se preparan como dueño (DIRECT_URL).
          DATABASE_URL: postgresql://siac_app:ci-siac-app@localhost:5432/siac
          DATABASE_URL_POWERBI: postgresql://siac_powerbi_lectura:ci-siac-powerbi@localhost:5432/siac
        run: pnpm test:e2e
      - name: Build del backend
        run: pnpm build
      - name: Preparar usuarios para Newman (BD efímera, sin secretos en el repo)
        env:
          NEWMAN_CLAVE_PRUEBA: ci-newman-clave-desechable-16
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
        run: pnpm prisma:seed && pnpm prisma:usuarios-newman
      - name: Newman — colección Postman /api/v1 (localhost, sin Supabase)
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgresql://siac_app:ci-siac-app@localhost:5432/siac
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
          JWT_SECRETO: ci-only-not-for-production
          S3_USAR_ALMACEN_LOCAL: "true"
          CARRERAS_SYNC_HABILITADO: "false"
          CORREO_CANAL: ninguno
          NODE_ENV: development
          PUERTO: "3001"
          NEWMAN_CLAVE_PRUEBA: ci-newman-clave-desechable-16
          NEWMAN_BASE_URL: http://127.0.0.1:3001/api/v1
        run: |
          cd Backend
          node dist/src/main.js &
          API_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/v1/salud >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/api/v1/salud
          chmod +x docs/pruebas/ejecutar-newman.sh docs/pruebas/verificar-destino-newman.sh
          ./docs/pruebas/ejecutar-newman.sh
          kill "$API_PID" || true
      - name: Publicar reportes Newman (sanitizados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-f05-${{ github.sha }}
          path: |
            docs/pruebas/reporte-newman.json
            docs/pruebas/reporte-newman.html
          if-no-files-found: warn

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
