name: CI

on:
  push:
    branches: [develop, develop_v2, main]
  pull_request:
    branches: [develop, develop_v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      # BD efímera solo para CI: valida las migraciones desde cero. Las cuentas de prueba las crea el E2E.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: siac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/siac
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
      JWT_SECRETO: ci-only-not-for-production
      S3_USAR_ALMACEN_LOCAL: "true"
      CARRERAS_SYNC_HABILITADO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Verificar tipos del backend (tsc)
        run: pnpm exec tsc --noEmit
      - name: Aplicar migraciones en PostgreSQL de CI
        run: pnpm exec prisma migrate deploy
      - name: Verificar el estado de las migraciones
        run: pnpm exec prisma migrate status
      - name: Verificar que schema.prisma no tenga drift frente a las migraciones
        # R-008.1a: si falla, el próximo `migrate dev` generaría DROP (p. ej. del FTS searchVector).
        run: |
          psql -h localhost -U postgres -d siac -c 'CREATE DATABASE siac_shadow'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres@localhost:5432/siac_shadow \
            --exit-code
      - name: Pruebas del backend
        run: pnpm exec jest --runInBand
      - name: Habilitar el login de los roles de RLS (solo CI, contraseñas desechables)
        run: |
          psql -h localhost -U postgres -d siac -c "ALTER ROLE siac_app LOGIN PASSWORD 'ci-siac-app'"
          psql -h localhost -U postgres -d siac -c "ALTER ROLE siac_powerbi_lectura LOGIN PASSWORD 'ci-siac-powerbi'"
      - name: Pruebas E2E contra PostgreSQL de CI (supertest), con la API como siac_app (RLS aplicada)
        env:
          # La API corre sin BYPASSRLS; los datos de prueba se preparan como dueño (DIRECT_URL).
          DATABASE_URL: postgresql://siac_app:ci-siac-app@localhost:5432/siac
          DATABASE_URL_POWERBI: postgresql://siac_powerbi_lectura:ci-siac-powerbi@localhost:5432/siac
        run: pnpm test:e2e
      - name: Build del backend
        run: pnpm build
      - name: Preparar usuarios para Newman (BD efímera, sin secretos en el repo)
        env:
          NEWMAN_CLAVE_PRUEBA: ci-newman-clave-desechable-16
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
        run: pnpm prisma:seed && pnpm prisma:usuarios-newman && pnpm prisma:fixtures-newman
      - name: Newman — colección Postman /api/v1 (localhost, sin Supabase)
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgresql://siac_app:ci-siac-app@localhost:5432/siac
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/siac
          JWT_SECRETO: ci-only-not-for-production
          S3_USAR_ALMACEN_LOCAL: "true"
          CARRERAS_SYNC_HABILITADO: "false"
          CORREO_CANAL: ninguno
          NODE_ENV: development
          PUERTO: "3001"
          NEWMAN_CLAVE_PRUEBA: ci-newman-clave-desechable-16
          NEWMAN_BASE_URL: http://127.0.0.1:3001/api/v1
        run: |
          cd Backend
          node dist/src/main.js &
          API_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/v1/salud >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/api/v1/salud
          cd "${GITHUB_WORKSPACE}"
          chmod +x docs/pruebas/ejecutar-newman.sh docs/pruebas/verificar-destino-newman.sh
          ./docs/pruebas/ejecutar-newman.sh
          kill "$API_PID" || true
      - name: Publicar reportes Newman (sanitizados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-f05-${{ github.sha }}
          path: |
            docs/pruebas/reporte-newman.json
            docs/pruebas/reporte-newman.html
          if-no-files-found: warn

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker — build e humo API/web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/siac
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/siac
      JWT_SECRETO: ci-only-not-for-production
      S3_USAR_ALMACEN_LOCAL: "true"
      FRONTEND_URL: http://localhost:3000
      CORREO_CANAL: ninguno
      CARRERAS_SYNC_HABILITADO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen API (runtime)
        run: docker build -t siac-api:ci -f Backend/Dockerfile --target runtime Backend
      - name: Build imagen API (tools)
        run: docker build -t siac-api-tools:ci -f Backend/Dockerfile --target tools Backend
      - name: Build imagen frontend
        run: docker build -t siac-web:ci -f Frontend/Dockerfile --target runtime Frontend
      - name: Aplicar migraciones en contenedor tools
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e DIRECT_URL \
            siac-api-tools:ci pnpm prisma:deploy
      - name: Arrancar API y comprobar /api/v1/salud
        run: |
          docker run -d --name siac-api-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL -e DIRECT_URL -e JWT_SECRETO \
            -e S3_USAR_ALMACEN_LOCAL -e FRONTEND_URL \
            -e CORREO_CANAL -e CARRERAS_SYNC_HABILITADO \
            siac-api:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/v1/salud >/dev/null; then ok=1; break; fi
            if ! docker ps -q --filter name=^siac-api-ci$ | grep -q .; then
              echo "::error::El contenedor API se detuvo antes del health check"
              docker logs siac-api-ci
              exit 1
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Timeout esperando /api/v1/salud"
            docker logs siac-api-ci
            curl -sv http://127.0.0.1:3001/api/v1/salud || true
            exit 1
          fi
          curl -sf http://127.0.0.1:3001/api/v1/salud
      - name: Arrancar frontend y comprobar respuesta HTTP
        run: |
          docker run -d --name siac-web-ci --network host \
            -e NODE_ENV=production \
            -e API_URL_INTERNAL=http://127.0.0.1:3001/api/v1 \
            -e HOSTNAME=0.0.0.0 \
            -e PORT=3000 \
            siac-web:ci
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if echo "$code" | grep -qE '^(200|307|308)$'; then break; fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
          echo "HTTP frontend: $code"
          echo "$code" | grep -qE '^(200|307|308)$'
      - name: Detener contenedores de humo
        if: always()
        run: docker rm -f siac-api-ci siac-web-ci 2>/dev/null || true
